name: Emirleri işle

on:
  push:
    branches: [main]
    paths: ['emirler/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Hangi müşterinin bekleyen emri var? (GitHub sunucusunda, birkaç saniye)
  planla:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.b.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: b
        run: python3 .github/scripts/bekleyen.py

  # Her müşterinin emri kendi makinesindeki runner'da işlenir (etiket = müşteri adı)
  isle:
    needs: planla
    if: needs.planla.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        hedef: ${{ fromJSON(needs.planla.outputs.matrix) }}
    runs-on: [self-hosted, '${{ matrix.hedef.label }}']
    concurrency:
      group: yurutucu-${{ matrix.hedef.label }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Emirleri işle (${{ matrix.hedef.musteri }})
        shell: powershell
        run: |
          git config user.name "${{ matrix.hedef.musteri }} Yurutucu"
          git config user.email "yurutucu@ai-life.local"
          git config pull.rebase true
          git config rebase.autoStash true
          claude -p "emirleri işle (makine: ${{ matrix.hedef.musteri }})" --allowedTools "mcp__adt" "Bash(git:*)" "Read" "Edit" "Write"
